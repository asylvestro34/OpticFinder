limit_req_zone $binary_remote_addr zone=opticfinder_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=opticfinder_connections:10m;

server {
    listen 80;
    server_name opticfinder.ddns.net;
    if ($host != opticfinder.ddns.net) { return 444; }
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/opticfinder-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://opticfinder.ddns.net$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name opticfinder.ddns.net;
    if ($host != opticfinder.ddns.net) { return 444; }
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/opticfinder.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opticfinder.ddns.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:opticfinder_tls:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        include /etc/nginx/snippets/opticfinder.proxy.conf;
    }
}
