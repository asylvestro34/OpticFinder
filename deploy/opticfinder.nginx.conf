# Installed in /etc/nginx/sites-available; included within nginx's http context.
limit_req_zone $binary_remote_addr zone=opticfinder_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=opticfinder_connections:10m;

server {
    listen 80;
    server_name opticfinder.ddns.net;
    if ($host != opticfinder.ddns.net) { return 444; }

    server_tokens off;
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        # HTTP serves no application until Certbot enables HTTPS.
        return 503 "HTTPS setup is not complete.\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/opticfinder-acme;
        try_files $uri =404;
    }
}
