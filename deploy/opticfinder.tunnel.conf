limit_req_zone $server_name zone=opticfinder_tunnel_requests:1m rate=5r/s;
limit_conn_zone $server_name zone=opticfinder_tunnel_connections:1m;

server {
    listen 127.0.0.1:8080;
    server_name overkill-trustee-conjuror.ngrok-free.dev;
    server_tokens off;
    if ($host != overkill-trustee-conjuror.ngrok-free.dev) { return 444; }

    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        limit_req zone=opticfinder_tunnel_requests burst=30 nodelay;
        limit_conn opticfinder_tunnel_connections 10;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
    }
}
